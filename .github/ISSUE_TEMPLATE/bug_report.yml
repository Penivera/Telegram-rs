name: "🐛 Bug Report"
description: File a bug report to help us improve telegram-rs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: telegram-rs version
      description: What version of telegram-rs are you using? (e.g., 0.1.1, main branch)
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: rustc_version
    attributes:
      label: Rust Toolchain (`rustc --version`)
      description: What Rust compiler version are you using?
      placeholder: "rustc 1.75.0 (stable)"
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: Enabled Features
      description: Check all features enabled in your `Cargo.toml`.
      options:
        - label: "default (`bot`)"
        - label: "`mini-app`"
        - label: "`wallet`"
        - label: "`webhook`"
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example or steps to reproduce the behavior.
      placeholder: |
        ```rust
        // Minimal reproducible example
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Backtrace
      description: Please copy and paste any relevant logs, compiler errors, or backtraces (with `RUST_BACKTRACE=1`).
      render: shell
